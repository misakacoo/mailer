# 邮件营销系统 —— 应用容器编排
#
# 这里只跑应用：数据库、API、发送进程、前端静态站点。
# **不含任何 TLS 逻辑**：证书、443、域名都在你自己的反向代理上做。
#
# 端口全部绑 127.0.0.1：Docker 的端口映射直接写 iptables，绕过 ufw；
# 写成 "3000:3000" 会监听 0.0.0.0，等于把没有 TLS 的 API 暴露到公网。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailer
      POSTGRES_USER: mailer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      # 会话时区必须是 UTC：业务库里的 now() 依赖它，偏 8 小时会让退避重试时间全乱
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailer -d mailer"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # 不写 ports：只在 compose 内网可达，宿主机和外网都连不上

  api:
    image: ${MAILER_IMAGE:-ghcr.io/misakacoo/mailer:latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mailer:${DB_PASSWORD}@postgres:5432/mailer
      APP_URL: ${APP_URL:?请在 .env 里设置 APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      TMP_DIR: /data/tmp
      # 容器内必须监听 0.0.0.0，否则端口映射进不来
      HOST: 0.0.0.0
      PORT: 3000
      # 只有 api 跑迁移；worker 等它健康后再起
      RUN_MIGRATIONS: "1"
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    image: ${MAILER_IMAGE:-ghcr.io/misakacoo/mailer:latest}
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mailer:${DB_PASSWORD}@postgres:5432/mailer
      APP_URL: ${APP_URL:?请在 .env 里设置 APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      TMP_DIR: /data/tmp
      HOST: 0.0.0.0
    volumes:
      # 同一个 data 卷：密钥文件共享，导入任务的暂存文件也在这里
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # 比 api 长：等正在发的那封 SMTP 会话自然结束，避免半途掐断被服务商判为异常
    stop_grace_period: 60s

  web:
    image: ${MAILER_WEB_IMAGE:-ghcr.io/misakacoo/mailer-web:latest}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  # secrets.env（CRED_KEY / JWT_SECRET）、上传附件、导入暂存都在这。
  # 可以 docker compose down，但绝不能 down -v：那会把 SMTP 密码的加密密钥一起删掉。
  data:
