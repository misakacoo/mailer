# 邮件营销系统 · Nginx 站点模板（HTTPS 正式态）
#
# 由 deploy/install.sh 渲染：把 __CERT_NAME__ 替换成证书目录名
#   - IP 直连：__CERT_NAME__ = 203.0.113.10
#   - 域名：  __CERT_NAME__ = mail.example.com
#
# 渲染结果写入 /etc/nginx/sites-available/mailer
#
# 这份配置同时覆盖 IP 与域名两种场景，不再维护两份，
# 避免出现「改了追踪路由却忘了改域名版」这种分叉。

upstream mailer_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 续期用：ACME 验证必须能走明文 HTTP，所以这条要留在重定向之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 12 自带 nginx 1.22，http2 只能写在 listen 里（1.25+ 才有独立的 http2 指令）
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        off;  # 短周期证书配合 OCSP 意义不大，且会拖慢握手

    root /opt/mailer/apps/web/dist;
    index index.html;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://mailer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # 邮件里的地址是 /t/...，由 nginx 转成应用内部的 /api/t/...
    location /t/ {
        proxy_pass http://mailer_api/api/t/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        access_log off;
    }

    # 退订页：GET 展示确认页，POST 执行退订（RFC 8058 一键退订也走 POST）
    location /u/ {
        proxy_pass http://mailer_api/api/u/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
