# 邮件营销系统 · Nginx 站点配置（IP 直连 / 纯 HTTP 版）
# 放置：/etc/nginx/sites-available/mailer
# 启用：ln -s /etc/nginx/sites-available/mailer /etc/nginx/sites-enabled/mailer
#
# 说明：当前用 IP 直接访问，没有域名和证书。
# 因为没有 HTTPS，应用侧的 Cookie 必须关闭 Secure 标记（APP_URL 为 http:// 时自动判断）。
# 以后接入域名时换成 mailer-domain.conf。

upstream mailer_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 前端构建产物
    root /opt/mailer/apps/web/dist;
    index index.html;

    # 联系人 CSV/XLSX 导入、附件上传
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Let's Encrypt 签发 IP 证书用的 HTTP-01 验证路径
    # 必须放在重定向之前，且用 ^~ 防止被后面的普通 location 抢走
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # 带哈希的静态资源长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存，避免发版后用户拿到旧壳
    location = /index.html {
        expires -1;
    }

    # ---- 业务接口 ----
    location /api/ {
        proxy_pass http://mailer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # ---- 打开像素 / 点击跳转 / 退订（这些地址会出现在邮件正文里）----
    # 必须禁缓存，否则打开统计失真、退订可能拿到旧状态
    location /t/ {
        # 邮件里的地址是 /t/...，由 nginx 转成应用内部的 /api/t/...
        proxy_pass http://mailer_api/api/t/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        access_log off;
    }

    # ---- 退订页：GET 展示确认页，POST 执行退订（RFC 8058 一键退订也走 POST）----
    location /u/ {
        proxy_pass http://mailer_api/api/u/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
