# 只负责把前端静态文件发出去。
# TLS、限流、/api 反向代理都不在这里——由使用者自己的反向代理处理。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端的导入上限保持一致，否则大文件在代理层就被挡了
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的资源可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不缓存：否则发版后老用户一直看到旧页面
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 单页应用：深链接回退到 index.html，否则刷新 /campaigns 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
